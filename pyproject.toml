[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-ai-manager"
version = "0.1.0"
description = "Evidence-based Fantasy Premier League forecasting and advisory optimization"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
 "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.13,<2", "scikit-learn>=1.8,<1.9",
 "httpx>=0.27,<1", "pulp>=2.9,<4", "streamlit>=1.49,<2", "plotly>=5.24,<7",
 "joblib>=1.4,<2", "lightgbm>=4.5,<5",
]
[project.optional-dependencies]
ml = ["xgboost>=2.1,<4", "optuna>=4,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[project.scripts]
fpl-ai = "fpl_ai.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
